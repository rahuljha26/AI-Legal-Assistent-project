services:
  # ── Django API Backend Service ──────────────────────────────────────────────
  - type: web
    name: lexai-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python project/manage.py migrate"
    startCommand: "cd project && gunicorn project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_URL
        value: "https://dharma-ai-legal-assistent.netlify.app"
